<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .logo-text { font-family: Arial, sans-serif; font-weight: bold; }
    @media (prefers-color-scheme: dark) {
      .logo-bg { fill: #111827; }
      .logo-primary { fill: #00AE98; }
      .logo-secondary { fill: #F3F4F6; }
    }
    @media (prefers-color-scheme: light) {
      .logo-bg { fill: #F3F4F6; }
      .logo-primary { fill: #00AE98; }
      .logo-secondary { fill: #111827; }
    }
  </style>
  
  <rect class="logo-bg" x="0" y="0" width="200" height="200" rx="20" ry="20" />
  
  <!-- Calendar base -->
  <rect class="logo-primary" x="40" y="40" width="120" height="120" rx="10" ry="10" />
  
  <!-- Calendar top bar -->
  <rect class="logo-secondary" x="50" y="50" width="100" height="20" rx="5" ry="5" />
  
  <!-- Calendar lines -->
  <line x1="40" y1="80" x2="160" y2="80" stroke="#F3F4F6" stroke-width="2" />
  <line x1="80" y1="80" x2="80" y2="160" stroke="#F3F4F6" stroke-width="2" />
  <line x1="120" y1="80" x2="120" y2="160" stroke="#F3F4F6" stroke-width="2" />
  
  <!-- Smart/AI representation -->
  <circle class="logo-secondary" cx="100" cy="120" r="25" />
  <path class="logo-primary" d="M85 120 L100 105 L115 120 L100 135 Z" />
  
  <!-- Text -->
  <text x="100" y="185" text-anchor="middle" class="logo-text logo-secondary" font-size="16">SMART BOOKINGS</text>
</svg>