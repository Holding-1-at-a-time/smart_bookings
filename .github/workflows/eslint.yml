name: ESLint

on:
  push:
    branches: 
      - main
      - development
  pull_request:
    branches: 
      - main
      - development
  schedule:
    - cron: '28 23 * * 5' # Runs every Friday at 23:28 UTC

jobs:
  eslint:
    name: Run ESLint Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: write
      security-events: write
      actions: write # Required for private repositories to get the Action run status
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install ESLint
        run: |
          npm install eslint@9.21.0
          npm install @microsoft/eslint-formatter-sarif@3.1.0
        continue-on-error: true

      - name: Run ESLint
        run: npx eslint . --format=compact > eslint-results.sarif

      - name: Upload Analysis Results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: eslint-results.sarif
          wait-for-processing: true
